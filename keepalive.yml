name: Keep Alive ROW Safety Bot

on:
  schedule:
    # ทุก 10 นาที | 08:00–16:00 เวลาไทย (UTC+7)
    # UTC = 01:00–09:00
    - cron: "*/10 1-9 * * 1-5"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up bot
        run: |
          curl -s https://rowsafety-bot.onrender.com/health
